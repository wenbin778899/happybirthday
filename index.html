      <!-- 手机横屏提示JavaScript -->
      <script>
      // 手机横屏提示逻辑
      (function() {
          // 检测是否为移动设备
          function isMobileDevice() {
              const userAgent = navigator.userAgent.toLowerCase();
              const mobileKeywords = ['android', 'iphone', 'ipad', 'ipod', 'blackberry', 'windows phone', 'mobile'];
              return mobileKeywords.some(keyword => userAgent.includes(keyword)) || 
                     window.innerWidth <= 768 || 
                     ('ontouchstart' in window && 'orientation' in window);
          }
          
          // 检测是否在应用内浏览器（如微信、QQ等）
          function isInAppBrowser() {
              const userAgent = navigator.userAgent.toLowerCase();
              return /micromessenger|qq|weibo|douban/.test(userAgent);
          }
          
          // 检测是否为竖屏
          function isPortrait() {
              return window.innerHeight > window.innerWidth;
          }
          
          // 显示提示
          function showLandscapeTip() {
              const tip = document.getElementById('mobile-landscape-tip');
              if (tip && (isMobileDevice() || isInAppBrowser()) && isPortrait()) {
                  // 检查是否已经显示过（避免重复提醒）
                  if (!sessionStorage.getItem('landscapeTipShown')) {
                      tip.style.display = 'flex';
                      sessionStorage.setItem('landscapeTipShown', 'true');
                  }
              }
          }
          
          // 页面加载完成后检查
          window.addEventListener('load', function() {
              setTimeout(showLandscapeTip, 1000); // 延迟1秒显示，确保页面加载完成
          });
          
          // 屏幕旋转时检查
          window.addEventListener('orientationchange', function() {
              setTimeout(function() {
                  const tip = document.getElementById('mobile-landscape-tip');
                  if (tip) {
                      // 检查当前方向
                      var isCurrentlyPortrait = window.innerHeight > window.innerWidth;
                      var isLandscape = window.innerWidth > window.innerHeight;
                      
                      if (isCurrentlyPortrait && (isMobileDevice() || isInAppBrowser()) && !sessionStorage.getItem('landscapeTipDismissed')) {
                          tip.style.display = 'flex';
                      } else if (isLandscape) {
                          // 横屏时自动隐藏提示
                          tip.style.display = 'none';
                      }
                  }
              }, 500); // 等待旋转动画完成
          });
          
          // 按钮事件处理
          document.addEventListener('DOMContentLoaded', function() {
              const tip = document.getElementById('mobile-landscape-tip');
              const continueBtn = document.getElementById('continue-anyway');
              const copyBtn = document.getElementById('copy-link');
              
              // 继续浏览按钮
              if (continueBtn) {
                  continueBtn.addEventListener('click', function() {
                      tip.style.display = 'none';
                      sessionStorage.setItem('landscapeTipDismissed', 'true');
                  });
              }
              
              // 复制链接按钮
              if (copyBtn) {
                  copyBtn.addEventListener('click', function() {
                      const currentUrl = window.location.href;
                      
                      // 尝试使用现代API复制
                      if (navigator.clipboard && navigator.clipboard.writeText) {
                          navigator.clipboard.writeText(currentUrl).then(function() {
                              copyBtn.textContent = '已复制!';
                              setTimeout(function() {
                                  copyBtn.textContent = '复制链接';
                              }, 2000);
                          }).catch(function() {
                              // 降级到传统方法
                              fallbackCopyTextToClipboard(currentUrl);
                          });
                      } else {
                          // 降级到传统方法
                          fallbackCopyTextToClipboard(currentUrl);
                      }
                      
                      function fallbackCopyTextToClipboard(text) {
                          const textArea = document.createElement("textarea");
                          textArea.value = text;
                          textArea.style.position = "fixed";
                          textArea.style.left = "-999999px";
                          textArea.style.top = "-999999px";
                          document.body.appendChild(textArea);
                          textArea.focus();
                          textArea.select();
                          
                          try {
                              const successful = document.execCommand('copy');
                              if (successful) {
                                  copyBtn.textContent = '已复制!';
                                  setTimeout(function() {
                                      copyBtn.textContent = '复制链接';
                                  }, 2000);
                              }
                          } catch (err) {
                              copyBtn.textContent = '复制失败';
                              setTimeout(function() {
                                  copyBtn.textContent = '复制链接';
                              }, 2000);
                          }
                          
                          document.body.removeChild(textArea);
                      }
                  });
              }
          });
      })();
      
      // 音频自动播放处理
      (function() {
          const audio = document.getElementById('bgMusic');
          const musicBtn = document.getElementById('music-toggle');
          let isPlaying = false;
          let userInteracted = false;
          
          if (!audio || !musicBtn) return;
          
          // 尝试自动播放（可能被浏览器阻止）
          function tryAutoPlay() {
              if (!userInteracted) return;
              
              const playPromise = audio.play();
              if (playPromise !== undefined) {
                  playPromise.then(() => {
                      isPlaying = true;
                      updateMusicButton();
                      console.log('音频自动播放成功');
                  }).catch(error => {
                      console.log('音频自动播放被阻止:', error);
                      isPlaying = false;
                      updateMusicButton();
                  });
              }
          }
          
          // 更新音乐按钮状态
          function updateMusicButton() {
              if (isPlaying) {
                  musicBtn.textContent = '🔊';
                  musicBtn.title = '暂停音乐';
                  musicBtn.classList.add('playing');
              } else {
                  musicBtn.textContent = '🎵';
                  musicBtn.title = '播放音乐';
                  musicBtn.classList.remove('playing');
              }
          }
          
          // 音乐按钮点击事件
          musicBtn.addEventListener('click', function() {
              userInteracted = true;
              
              if (isPlaying) {
                  audio.pause();
                  isPlaying = false;
              } else {
                  const playPromise = audio.play();
                  if (playPromise !== undefined) {
                      playPromise.then(() => {
                          isPlaying = true;
                      }).catch(error => {
                          console.log('播放失败:', error);
                          isPlaying = false;
                      });
                  }
              }
              updateMusicButton();
          });
          
          // 监听音频事件
          audio.addEventListener('play', () => {
              isPlaying = true;
              updateMusicButton();
          });
          
          audio.addEventListener('pause', () => {
              isPlaying = false;
              updateMusicButton();
          });
          
          audio.addEventListener('ended', () => {
              isPlaying = false;
              updateMusicButton();
          });
          
          // 监听用户交互事件，尝试启动音频
          const interactionEvents = ['click', 'touchstart', 'keydown'];
          function handleUserInteraction() {
              userInteracted = true;
              // 延迟尝试播放，避免干扰其他交互
              setTimeout(() => {
                  if (!isPlaying) {
                      tryAutoPlay();
                  }
              }, 1000);
              
              // 只需要一次用户交互，后续可以移除监听器
              interactionEvents.forEach(event => {
                  document.removeEventListener(event, handleUserInteraction);
              });
          }
          
          interactionEvents.forEach(event => {
              document.addEventListener(event, handleUserInteraction);
          });
          
          // 初始化按钮状态
          updateMusicButton();
      })();
      </script>

    <script>
    (function(){
        var canvas = $('#canvas');
    
        if (!canvas[0].getContext) {
            $("#error").show();
            return false;        }

        // 响应式Canvas尺寸计算
        var isMobile = window.innerWidth <= 768;
        var width = isMobile ? Math.min(window.innerWidth - 10, 400) : Math.min(canvas.parent().width(), 1100);
        var height = isMobile ? Math.min(window.innerHeight * 0.5, 400) : Math.min(canvas.parent().height(), 680);
        
        canvas.attr("width", width);
        canvas.attr("height", height);
        canvas.css({'width': width + 'px', 'height': height + 'px'});
        var opts = {
            seed: {
                x: width / 2 - (isMobile ? 10 : 20),
                color: "rgb(190, 26, 37)",
                scale: isMobile ? 1.2 : 2
            },
            branch: isMobile ? [
                // 移动端简化的树枝配置
                [width * 0.5, height, width * 0.52, height * 0.4, width * 0.45, height * 0.3, 20, 80, [
                    [width * 0.49, height * 0.7, width * 0.41, height * 0.6, width * 0.31, height * 0.58, 8, 60],
                    [width * 0.5, height * 0.65, width * 0.55, height * 0.52, width * 0.62, height * 0.5, 8, 60],
                    [width * 0.49, height * 0.41, width * 0.49, height * 0.36, width * 0.49, height * 0.32, 2, 30],
                    [width * 0.5, height * 0.58, width * 0.38, height * 0.36, width * 0.3, height * 0.35, 6, 50]
                ]]
            ] : [
                // 桌面端原始配置
                [535, 680, 570, 250, 500, 200, 30, 100, [
                    [540, 500, 455, 417, 340, 400, 13, 100, [
                        [450, 435, 434, 430, 394, 395, 2, 40]
                    ]],
                    [550, 445, 600, 356, 680, 345, 12, 100, [
                        [578, 400, 648, 409, 661, 426, 3, 80]
                    ]],
                    [539, 281, 537, 248, 534, 217, 3, 40],
                    [546, 397, 413, 247, 328, 244, 9, 80, [
                        [427, 286, 383, 253, 371, 205, 2, 40],
                        [498, 345, 435, 315, 395, 330, 4, 60]
                    ]],
                    [546, 357, 608, 252, 678, 221, 6, 100, [
                        [590, 293, 646, 277, 648, 271, 2, 80]
                    ]]
                ]] 
            ],
            bloom: {
                num: isMobile ? 300 : 700,
                width: width,
                height: height,
            },
            footer: {
                width: 1200,
                height: 5,
                speed: 10,
            }
        }

        var tree = new Tree(canvas[0], width, height, opts);
        var seed = tree.seed;
        var foot = tree.footer;
        var hold = 1;

        // 移动端触摸支持
        function getEventPos(e) {
            // 支持多种触摸事件类型
            if (e.touches && e.touches.length > 0) {
                return {
                    pageX: e.touches[0].pageX,
                    pageY: e.touches[0].pageY,
                    clientX: e.touches[0].clientX,
                    clientY: e.touches[0].clientY
                };
            }
            if (e.changedTouches && e.changedTouches.length > 0) {
                return {
                    pageX: e.changedTouches[0].pageX,
                    pageY: e.changedTouches[0].pageY,
                    clientX: e.changedTouches[0].clientX,
                    clientY: e.changedTouches[0].clientY
                };
            }
            return {
                pageX: e.pageX || e.clientX,
                pageY: e.pageY || e.clientY,
                clientX: e.clientX,
                clientY: e.clientY
            };
        }
        
        function getCanvasCoordinates(e) {
            var rect = canvas[0].getBoundingClientRect();
            var pos = getEventPos(e);
            
            // 使用clientX/Y更精确
            var x = pos.clientX - rect.left;
            var y = pos.clientY - rect.top;
            
            // 适配Canvas的实际显示尺寸与内部尺寸的比例
            var scaleX = canvas.attr('width') / rect.width;
            var scaleY = canvas.attr('height') / rect.height;
            
            return {
                x: x * scaleX,
                y: y * scaleY
            };
        }
        
        function handleInteraction(e) {
            try {
                var coords = getCanvasCoordinates(e);
                
                console.log('Touch coordinates:', coords.x, coords.y, 'Seed position:', seedX, seedY, 'Distance:', distance); // 调试信息
                
                // 显示调试信息（开发时使用）
                if (isMobile && window.location.hash === '#debug') {
                    var debugInfo = document.getElementById('debug-info') || document.createElement('div');
                    debugInfo.id = 'debug-info';
                    debugInfo.style.cssText = 'position:fixed;top:10px;left:10px;background:rgba(0,0,0,0.8);color:white;padding:10px;font-size:12px;z-index:10000;';
                    debugInfo.innerHTML = `Touch: (${Math.round(coords.x)}, ${Math.round(coords.y)})<br>Seed: (${Math.round(seedX)}, ${Math.round(seedY)})<br>Distance: ${Math.round(distance)}<br>Radius: ${hitRadius}<br>Canvas: ${canvas.attr('width')}x${canvas.attr('height')}`;
                    if (!document.getElementById('debug-info')) {
                        document.body.appendChild(debugInfo);
                    }
                }
                
                // 移动端增大点击区域
                var hitRadius = isMobile ? 30 : 15;
                var seedX = seed.cirle.point.x;
                var seedY = seed.cirle.point.y;
                
                // 检查是否在爱心区域内
                var distance = Math.sqrt(Math.pow(coords.x - seedX, 2) + Math.pow(coords.y - seedY, 2));
                var isInSeed = seed.hover(coords.x, coords.y) || distance < hitRadius;
                
                console.log('Seed position:', seedX, seedY, 'Distance:', distance, 'Hit:', isInSeed);
                
                if (isInSeed) {
                    // 添加触觉反馈
                    if (navigator.vibrate) {
                        navigator.vibrate(50);
                    }
                    
                    hold = 0; 
                    canvas.off("click touchstart touchend");
                    canvas.off("mousemove touchmove");
                    canvas.removeClass('hand');
                    
                    // 显示点击效果
                    showClickEffect(coords.x, coords.y);
                }
            } catch (error) {
                console.error('Touch interaction error:', error);
            }
        }
        
        // 点击效果反馈
        function showClickEffect(x, y) {
            var effect = $('<div class="click-effect"></div>');
            effect.css({
                position: 'fixed',
                left: x + 'px',
                top: y + 'px',
                width: '20px',
                height: '20px',
                background: 'rgba(255, 77, 77, 0.6)',
                borderRadius: '50%',
                pointerEvents: 'none',
                zIndex: '9999',
                transform: 'translate(-50%, -50%)',
                animation: 'clickRipple 0.6s ease-out forwards'
            });
            
            $('body').append(effect);
            setTimeout(function() { effect.remove(); }, 600);
        }
        
        // 事件监听 - 支持多种移动端事件
        canvas.on('click', function(e) {
            e.preventDefault();
            handleInteraction(e);
        });
        
        // 移动端触摸事件
        canvas.on('touchstart', function(e) {
            e.preventDefault();
            handleInteraction(e);
        });
        
        canvas.on('touchend', function(e) {
            e.preventDefault();
            handleInteraction(e);
        });
        
        // 悬停效果事件
        canvas.on('mousemove touchmove', function(e){
            try {
                var coords = getCanvasCoordinates(e);
                var hitRadius = isMobile ? 30 : 15;
                var seedX = seed.cirle.point.x;
                var seedY = seed.cirle.point.y;
                var distance = Math.sqrt(Math.pow(coords.x - seedX, 2) + Math.pow(coords.y - seedY, 2));
                var isInSeed = seed.hover(coords.x, coords.y) || distance < hitRadius;
                
                canvas.toggleClass('hand', isInSeed);
                
                // 移动端触摸反馈
                if (isMobile && isInSeed) {
                    canvas.css('cursor', 'pointer');
                }
            } catch (error) {
                console.error('Hover effect error:', error);
            }
        });

        var seedAnimate = eval(Jscex.compile("async", function () {
            seed.draw();
            while (hold) {
                $await(Jscex.Async.sleep(10));
            }
            while (seed.canScale()) {
                seed.scale(0.95);
                $await(Jscex.Async.sleep(10));
            }
            while (seed.canMove()) {
                seed.move(0, 2);
                foot.draw();
                $await(Jscex.Async.sleep(10));
            }
        }));

        var growAnimate = eval(Jscex.compile("async", function () {
            do {
              tree.grow();
                $await(Jscex.Async.sleep(10));
            } while (tree.canGrow());
        }));

        var flowAnimate = eval(Jscex.compile("async", function () {
            do {
              tree.flower(2);
                $await(Jscex.Async.sleep(10));
            } while (tree.canFlower());
        }));

        var moveAnimate = eval(Jscex.compile("async", function () {
            tree.snapshot("p1", 240, 0, 610, 680);
            while (tree.move("p1", 500, 0)) {
                foot.draw();
                $await(Jscex.Async.sleep(10));
            }
            foot.draw();
            tree.snapshot("p2", 500, 0, 610, 680);

            // 会有闪烁不得意这样做, (＞﹏＜)
            canvas.parent().css("background", "url(" + tree.toDataURL('image/png') + ")");
            canvas.css("background", "#ffe");
            $await(Jscex.Async.sleep(300));
            canvas.css("background", "none");
        }));

        var jumpAnimate = eval(Jscex.compile("async", function () {
            var ctx = tree.ctx;
            while (true) {
                tree.ctx.clearRect(0, 0, width, height);
                tree.jump();
                foot.draw();
                $await(Jscex.Async.sleep(25));
            }
        }));

        var textAnimate = eval(Jscex.compile("async", function () {
        var together = new Date();
        together.setFullYear(2009,10,23 );      //时间年月日
        together.setHours(16);            //小时  
        together.setMinutes(53);          //分钟
        together.setSeconds(0);         //秒前一位
        together.setMilliseconds(2);        //秒第二位

        $("#code").show().typewriter();
            $("#clock-box").fadeIn(500);
            while (true) {
                timeElapse(together);
                $await(Jscex.Async.sleep(1000));
            }
        }));

        var runAsync = eval(Jscex.compile("async", function () {
            $await(seedAnimate());
            $await(growAnimate());
            $await(flowAnimate());
            $await(moveAnimate());
            textAnimate().start();
            $await(jumpAnimate());
        }));

        // 添加窗口resize监听（移动端旋转适配）
        var resizeTimer;
        var lastOrientation = window.orientation;
        var lastWidth = window.innerWidth;
        var lastHeight = window.innerHeight;
        
        function handleOrientationChange() {
            var currentOrientation = window.orientation;
            var currentWidth = window.innerWidth;
            var currentHeight = window.innerHeight;
            
            // 检查是否真的发生了旋转
            var orientationChanged = currentOrientation !== lastOrientation;
            var sizeChanged = Math.abs(currentWidth - lastWidth) > 50 || Math.abs(currentHeight - lastHeight) > 50;
            
            if (orientationChanged || sizeChanged) {
                console.log('Screen orientation/size changed, updating canvas...');
                
                // 重新计算Canvas尺寸
                var newIsMobile = currentWidth <= 768;
                var newWidth = newIsMobile ? Math.min(currentWidth - 10, 400) : Math.min(1100, currentWidth - 100);
                var newHeight = newIsMobile ? Math.min(currentHeight * 0.5, 400) : Math.min(680, currentHeight - 100);
                
                // 更新Canvas尺寸
                canvas.attr("width", newWidth);
                canvas.attr("height", newHeight);
                canvas.css({'width': newWidth + 'px', 'height': newHeight + 'px'});
                
                // 重新绑定事件处理器（因为坐标系统已经改变）
                canvas.off('click touchstart mousemove touchmove');
                
                // 重新绑定触摸和点击事件
                canvas.on('click touchstart', function(e) {
                    e.preventDefault();
                    handleInteraction(e);
                }).on('mousemove touchmove', function(e){
                    var offset = canvas.offset(), x, y;
                    var pos = getEventPos(e);
                    x = pos.pageX - offset.left;
                    y = pos.pageY - offset.top;
                    
                    var rect = canvas[0].getBoundingClientRect();
                    var scaleX = canvas.attr('width') / rect.width;
                    var scaleY = canvas.attr('height') / rect.height;
                    
                    x *= scaleX;
                    y *= scaleY;
                    
                    canvas.toggleClass('hand', seed.hover(x, y));
                });
                
                // 更新记录的状态
                lastOrientation = currentOrientation;
                lastWidth = currentWidth;
                lastHeight = currentHeight;
                
                console.log('Canvas updated:', newWidth + 'x' + newHeight);
            }
        }
        
        $(window).on('resize orientationchange', function() {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(handleOrientationChange, 500); // 增加延迟确保旋转动画完成
        });
        
        // 移动端爱心点击提示
        if (isMobile) {
            setTimeout(function() {
                var tip = $('<div class="mobile-heart-tip">💖 点击爱心开始</div>');
                tip.css({
                    position: 'fixed',
                    top: '20px',
                    left: '50%',
                    transform: 'translateX(-50%)',
                    background: 'rgba(255, 77, 77, 0.9)',
                    color: '#fff',
                    padding: '8px 16px',
                    borderRadius: '20px',
                    fontSize: '14px',
                    fontWeight: '600',
                    zIndex: '1000',
                    animation: 'pulse 2s infinite',
                    boxShadow: '0 4px 12px rgba(255, 77, 77, 0.3)'
                });
                
                $('body').append(tip);
                
                // 5秒后自动消失
                setTimeout(function() {
                    tip.fadeOut(500, function() { tip.remove(); });
                }, 5000);
                
                // 点击后立即消失
                canvas.one('click touchstart', function() {
                    tip.fadeOut(300, function() { tip.remove(); });
                });
            }, 2000);
        }
        
        runAsync().start();
    })();

 <section id="bro-slideshow" class="slideshow inline-bottom" aria-label="兄弟照片轮播">

<script>
// 组件交互脚本（不影响原心形树逻辑）
(function(){
    const backTop = document.getElementById('back-to-top');
    const progressBar = document.querySelector('#scroll-progress .bar');
    const themeToggle = document.getElementById('theme-toggle');
    // 滚动进度 & 返回顶部显示
    window.addEventListener('scroll', ()=>{
        const st = window.scrollY;
        const dh = document.documentElement.scrollHeight - window.innerHeight;
        const pct = dh? (st/dh)*100 : 0;
        progressBar.style.width = pct + '%';
        if(st>400) backTop.classList.add('show'); else backTop.classList.remove('show');
    });
    backTop.addEventListener('click', ()=>window.scrollTo({top:0,behavior:'smooth'}));
    // 主题切换
    themeToggle.addEventListener('click', ()=>{
        document.body.classList.toggle('dark');
        localStorage.setItem('broTheme', document.body.classList.contains('dark')? 'dark':'light');
    });
    // 恢复主题
    (function(){const t = localStorage.getItem('broTheme'); if(t==='dark'){document.body.classList.add('dark');}})();

    /* ====== 底部内联轮播 ====== */
    const album = [
        {src:'photo/fig1.jpg', cap:'第一张：兄弟情起点——一起的傻笑是证据'},
        {src:'photo/fig2.jpg', cap:'第二张：那时我们觉得世界很大，其实口袋就装得下梦想'},
        {src:'photo/fig3.jpg', cap:'第三张：一起踩过的坑，最后都变成了段子'},
        {src:'photo/fig4.jpg', cap:'第四张：不管风多大，这种肩并肩的姿势没变'},
        {src:'photo/fig5.jpg', cap:'第五张：有兄弟的地方，就是主场'},
        {src:'photo/fig6.jpg', cap:'第六张：笑点共享，负担平摊'},
        {src:'photo/fig7.jpg', cap:'第七张：这姿势说明——那天肯定又吹了很远的未来'},
        {src:'photo/fig8.jpg', cap:'第八张：友情这条路，没有终点站'},
        {src:'photo/fig9.jpg', cap:'第九张：继续升级打怪，我们都要更强'},
        {src:'photo/fig10.jpg', cap:'第十张：彼此的底牌与底气'},
        {src:'photo/fig11.jpg', cap:'第十一张：有些瞬间不炫酷，却永远热血'},
        {src:'photo/fig12.jpg', cap:'第十二张：未来几年，再补更多新图'},
        {src:'photo/fig13.jpg', cap:'第十三张：兄弟，生日快乐，继续上大分！'}
    ];
    const slideImg = document.getElementById('slide-image');
    const slideCap = document.getElementById('slide-caption');
    const prevBtn = document.getElementById('prev-slide');
    const playBtn = document.getElementById('play-slide');
    const nextBtn = document.getElementById('next-slide');
    const toggleFloatBtn = document.getElementById('toggle-float');
    const slideClose = document.getElementById('slide-close');
    const slideHeader = document.getElementById('slide-header');
    const slideWrap = document.getElementById('bro-slideshow');
    const memoryBtn = document.getElementById('memory-btn');
    const bar = document.getElementById('slide-progress-bar');
    let idx = 0, playing = true, interval = 3800, rafId = 0, startTS = 0;
    function show(n){
        idx = (n+album.length)%album.length;
        // 淡出-换图-淡入
        slideImg.style.opacity='0';
        setTimeout(()=>{
            slideImg.src = album[idx].src;
            slideImg.alt = album[idx].cap;
            slideCap.textContent = album[idx].cap;
            slideImg.onload = ()=>{ slideImg.style.opacity='1'; };
        }, 220);
        restartProgress();
    }
    function restartProgress(){
        cancelAnimationFrame(rafId); bar.style.width='0%'; startTS = performance.now();
        function loop(t){
            const pct = Math.min(1, (t-startTS)/interval);
            bar.style.width = (pct*100)+'%';
            if(pct>=1){ show(idx+1); return; }
            if(playing) rafId = requestAnimationFrame(loop);
        }
        if(playing) rafId = requestAnimationFrame(loop);
    }
    prevBtn.addEventListener('click', ()=>{ show(idx-1); });
    nextBtn.addEventListener('click', ()=>{ show(idx+1); });
    playBtn.addEventListener('click', ()=>{ playing=!playing; playBtn.textContent = playing? '暂停':'播放'; if(playing) restartProgress(); });
    // 打开/关闭与悬浮拖动
    function setVisible(v){ slideWrap.style.display = v? 'block':'none'; }
    setVisible(false); // 默认关闭
    memoryBtn.addEventListener('click', ()=>{ const vis = slideWrap.style.display !== 'none'; setVisible(!vis? true:false); if(!vis){ show(0); } });
    slideClose.addEventListener('click', ()=> setVisible(false));
    document.addEventListener('keydown', e=>{ if(e.key==='Escape') setVisible(false); });
    // 悬浮切换
    let floating = false; 
    toggleFloatBtn.addEventListener('click', ()=>{
        floating = !floating;
        toggleFloatBtn.textContent = floating? '贴底': '悬浮';
        slideWrap.classList.toggle('inline-bottom', !floating);
        slideWrap.classList.toggle('float-card', floating);
        if(floating){
            // 右下角默认位
            slideWrap.style.left='auto'; slideWrap.style.top='auto'; slideWrap.style.right='24px'; slideWrap.style.bottom='24px';
        }else{
            slideWrap.style.left=''; slideWrap.style.top=''; slideWrap.style.right=''; slideWrap.style.bottom='';
        }
    });
    // 拖动，仅在悬浮模式 - 支持触摸和鼠标
    (function enableDrag(){
        let dragging=false, ox=0, oy=0;
        
        // 获取事件坐标（兼容触摸和鼠标）
        function getEventPos(e) {
            const touch = e.touches ? e.touches[0] : e;
            return { x: touch.clientX, y: touch.clientY };
        }
        
        // 鼠标事件
        slideHeader.addEventListener('mousedown', startDrag);
        window.addEventListener('mousemove', doDrag);
        window.addEventListener('mouseup', endDrag);
        
        // 触摸事件
        slideHeader.addEventListener('touchstart', startDrag, { passive: false });
        window.addEventListener('touchmove', doDrag, { passive: false });
        window.addEventListener('touchend', endDrag);
        
        function startDrag(e) {
            if(!floating) return;
            dragging = true;
            slideWrap.classList.add('dragging');
            const r = slideWrap.getBoundingClientRect();
            const pos = getEventPos(e);
            ox = pos.x - r.left;
            oy = pos.y - r.top;
            e.preventDefault();
        }
        
        function doDrag(e) {
            if(!dragging) return;
            const pos = getEventPos(e);
            const nx = pos.x - ox;
            const ny = pos.y - oy;
            slideWrap.style.left = nx + 'px';
            slideWrap.style.top = ny + 'px';
            slideWrap.style.right = 'auto';
            slideWrap.style.bottom = 'auto';
            e.preventDefault();
        }
        
        function endDrag() {
            if(dragging) {
                dragging = false;
                slideWrap.classList.remove('dragging');
            }
        }
    })();
        /* =============== 烟花逻辑（性能优化版） =============== */
        const fwBtn = document.getElementById('firework-btn');
        let fwCanvas = null, fwCtx=null, fireworks=[], particles=[];
        const fwState = { running:false, raf:0, lastTS:0, fpsEMA:60, frames:0, resScale:1, lastClick:0 };
        
        // 移动端检测
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || 
                         window.innerWidth <= 768 || 
                         ('ontouchstart' in window);
        
        const FW = {
            // 性能目标与阈值
            minFPS: isMobile ? 40 : 48,          // 移动端降低FPS要求
            recoverFPS: isMobile ? 50 : 57,      // 移动端降低恢复阈值
            // 数量上限 - 移动端减半
            maxParticles: isMobile ? 160 : 320,   // 移动端减少粒子数
            maxFireworks: isMobile ? 8 : 15,     // 移动端减少同屏烟花
            // 基础强度（按质量缩放）
            baseBurst: isMobile ? 6 : 10,        // 移动端减少发射数量
            baseParticles: isMobile ? 40 : 60,   // 移动端减少爆炸粒子
            // 渲染参数
            trailLen: isMobile ? 10 : 15,         // 移动端缩短轨迹
            cooldown: isMobile ? 300 : 50,       // 移动端增加冷却时间防止过热
        };
        // 按钮提示气泡
        function tipAtBtn(text){
            try{
                const r = fwBtn.getBoundingClientRect();
                const el = document.createElement('div');
                el.textContent = text;
                el.style.cssText = `position:fixed;left:${r.left + r.width/2}px;top:${r.top - 8}px;transform:translate(-50%,-100%);`+
                    `background:rgba(0,0,0,.65);color:#fff;padding:2px 6px;border-radius:6px;font-size:12px;pointer-events:none;`+
                    `opacity:0;transition:transform .25s ease, opacity .25s ease;z-index:9999;`;
                document.body.appendChild(el);
                requestAnimationFrame(()=>{ el.style.opacity='1'; el.style.transform = `translate(-50%,-140%)`; });
                setTimeout(()=>{ el.style.opacity='0'; el.style.transform=`translate(-50%,-170%)`; }, 550);
                setTimeout(()=>{ el.remove(); }, 900);
            }catch(e){}
        }
        function ensureCanvas(){
            if(!fwCanvas){
                fwCanvas = document.createElement('canvas');
                fwCanvas.className='firework-canvas';
                document.body.appendChild(fwCanvas);
                fwCtx = fwCanvas.getContext('2d');
                resizeFW();
                window.addEventListener('resize', resizeFW);
            }
        }
        function applyScale(){
            if(!fwCtx) return;
            const DPR = Math.min(window.devicePixelRatio || 1, 1.5); // 上限避免过高DPR
            const S = fwState.resScale; // 质量档：1 / 0.75 / 0.6
            fwCanvas.width = Math.floor(window.innerWidth * DPR * S);
            fwCanvas.height = Math.floor(window.innerHeight * DPR * S);
            fwCanvas.style.width = window.innerWidth + 'px';
            fwCanvas.style.height = window.innerHeight + 'px';
            fwCtx.setTransform(DPR*S, 0, 0, DPR*S, 0, 0);
        }
        function resizeFW(){ if(!fwCanvas) return; applyScale(); }
        function rand(min,max){return Math.random()*(max-min)+min;}
        function qualityFactor(){ // 根据分辨率档等比缩减强度
            return fwState.resScale; // 1, 0.75, 0.6
        }
        function startLoop(){
            if(fwState.running || !fwCtx) return;
            fwState.running = true;
            fwState.lastTS = 0; fwState.frames=0; fwState.fpsEMA=60;
            fwState.raf = requestAnimationFrame(fwLoop);
        }
        function stopLoop(){
            if(!fwState.running) return;
            fwState.running = false;
            if(fwState.raf) cancelAnimationFrame(fwState.raf);
            fwState.raf = 0;
        }
        function adjustQuality(){
            // 每30帧评估一次
            if(fwState.frames % 30 !== 0) return;
            const fps = fwState.fpsEMA;
            const levels = [1, 0.75, 0.6];
            let idx = levels.indexOf(fwState.resScale);
            if(fps < FW.minFPS && idx < levels.length-1){
                fwState.resScale = levels[idx+1];
                applyScale();
            } else if(fps > FW.recoverFPS && idx > 0){
                fwState.resScale = levels[idx-1];
                applyScale();
            }
        }
        function createFirework(sx,sy,tx,ty){
            if(fireworks.length >= FW.maxFireworks) return;
            const dist=Math.hypot(tx-sx,ty-sy);
            const trailMax = Math.max(4, Math.round(FW.trailLen * qualityFactor()));
            fireworks.push({x:sx,y:sy,sx,sy,tx,ty,dist,traveled:0,speed:rand(7,12),angle:Math.atan2(ty-sy,tx-sx),brightness:rand(70,100),trail:[],trailMax});
        }
        function createParticles(x,y){
            const q = qualityFactor();
            const count = Math.max(16, Math.round(FW.baseParticles * q));
            for(let i=0;i<count;i++){
                if(particles.length >= FW.maxParticles) break;
                particles.push({x,y,r:rand(1.6,3.2),angle:Math.random()*Math.PI*2,speed:rand(2.2,9.5),friction:.90,gravity:.11,brightness:rand(60,100),alpha:1,decay:rand(.010,.020)});
            }
        }
        function fwLoop(ts){
            if(!fwCtx){ stopLoop(); return; }
            // FPS 统计（指数滑动平均）
            if(fwState.lastTS){
                const dt = Math.min(200, ts - fwState.lastTS);
                const inst = dt>0 ? 1000/dt : 60;
                fwState.fpsEMA = fwState.fpsEMA*0.9 + inst*0.1;
            }
            fwState.lastTS = ts; fwState.frames++;
            adjustQuality();

            fwCtx.globalCompositeOperation='destination-out';
            fwCtx.fillStyle='rgba(0,0,0,0.28)';
            // 使用CSS像素尺寸清屏，避免在有setTransform缩放时过度绘制
            fwCtx.fillRect(0,0,window.innerWidth,window.innerHeight);
            fwCtx.globalCompositeOperation='lighter';

            // update fireworks
            for(let i=fireworks.length-1;i>=0;i--){
                const f=fireworks[i];
                const vx=Math.cos(f.angle)*f.speed;
                const vy=Math.sin(f.angle)*f.speed;
                f.x+=vx; f.y+=vy; f.traveled+=Math.hypot(vx,vy);
                // 轨迹
                f.trail.push({x:f.x,y:f.y});
                if(f.trail.length>f.trailMax) f.trail.shift();
                const hueF = ((ts/6 + i*20)%360);
                for(let t=0;t<f.trail.length;t++){
                    const pt=f.trail[t];
                    const fade=t/f.trail.length;
                    fwCtx.globalAlpha=fade*0.55;
                    fwCtx.fillStyle='hsl('+hueF+',100%,'+f.brightness+'%)';
                    fwCtx.fillRect(pt.x-1.5,pt.y-1.5,3,3);
                }
                fwCtx.globalAlpha=1;
                fwCtx.beginPath();
                fwCtx.arc(f.x,f.y,3,0,Math.PI*2);
                fwCtx.fillStyle='hsl('+hueF+',100%,'+f.brightness+'%)';
                fwCtx.fill();
                if(f.traveled>=f.dist){
                    fireworks.splice(i,1);
                    createParticles(f.x,f.y);
                }
            }

            // update particles
            for(let i=particles.length-1;i>=0;i--){
                const p=particles[i];
                p.speed*=p.friction;
                p.x+=Math.cos(p.angle)*p.speed;
                p.y+=Math.sin(p.angle)*p.speed + p.gravity;
                p.alpha-=p.decay;
                if(p.alpha<=0){particles.splice(i,1); continue;}
                fwCtx.globalAlpha=p.alpha;
                fwCtx.beginPath();
                fwCtx.arc(p.x,p.y,p.r,0,Math.PI*2);
                const hue = ((ts/8 + i*5)%360);
                fwCtx.fillStyle='hsl('+hue+',100%,'+p.brightness+'%)';
                // 去掉昂贵的阴影模糊，依赖 lighter 混合实现“发光”
                fwCtx.fill();
                fwCtx.globalAlpha=1;
            }

            // 若空闲则停止循环，节省资源
            if(fireworks.length===0 && particles.length===0){
                stopLoop();
                return;
            }
            fwState.raf = requestAnimationFrame(fwLoop);
        }
        
        // 移动端优化：简化为单击触发，但保持双击显示文字
        let fireworkClickCount = 0;
        let fireworkClickTimer = null;
        
        // 不修改按钮文字，保持"双击放烟花"的显示
        // 但实际功能改为单击即可触发
        
        function handleFireworkTrigger() {
            ensureCanvas();
            const now = performance.now();
            if(now - fwState.lastClick < FW.cooldown){
                tipAtBtn('冷却中');
                return; // 节流
            }
            fwState.lastClick = now;
            // 启动循环
            startLoop();
            // 依据质量决定发射数量
            const q = qualityFactor();
            let burst = Math.max(2, Math.round(FW.baseBurst * (q>=0.95?1: q>=0.7?0.9:0.8)));
            // 若接近上限，按可用槽位收敛，避免静默失败
            const slots = Math.max(0, FW.maxFireworks - fireworks.length);
            if(slots <= 0){ tipAtBtn('繁忙'); return; }
            burst = Math.max(1, Math.min(burst, slots));
            const centerX = window.innerWidth/2;
            const baseDelay = isMobile ? 200 : 160; // 移动端延迟稍长
            for(let i=0;i<burst;i++){
                if(fireworks.length >= FW.maxFireworks) break;
                setTimeout(()=>{
                    const tx = rand(80, window.innerWidth-80);
                    const ty = rand(80, window.innerHeight/2);
                    createFirework(centerX, window.innerHeight, tx, ty);
                }, i*baseDelay);
            }
        }
        
        // 统一使用单击触发（不管桌面端还是移动端）
        // 保持"双击放烟花"的提示文字，但实际单击就能用
        fwBtn.addEventListener('click', ()=>{
            handleFireworkTrigger();
        });
        
        /* =============== 滚动彩带（轻量） =============== */
        const milestones=[25,50,75,100];
        const firedMilestones=new Set();
        function throwConfetti(pct){
            // 简化版彩带：生成少量下落矩形
            const count=40; const colors=['#ff4d4d','#ffa64d','#ffd633','#52d6ff','#7c4dff'];
            const layer=document.createElement('canvas');
            layer.className='firework-canvas';
            document.body.appendChild(layer); const ctx=layer.getContext('2d');
            layer.width=innerWidth; layer.height=innerHeight;
            const pieces=[]; for(let i=0;i<count;i++){pieces.push({x:Math.random()*innerWidth,y:-20-Math.random()*200,w:8+Math.random()*8,h:12+Math.random()*10,color:colors[Math.floor(Math.random()*colors.length)],speedY:2+Math.random()*4,rot:Math.random()*Math.PI,rotSpeed:(Math.random()-.5)*0.2});}
            let frames=0; function anim(){ctx.clearRect(0,0,layer.width,layer.height); pieces.forEach(p=>{p.y+=p.speedY; p.rot+=p.rotSpeed; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle=p.color; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore();}); frames++; if(frames<240){requestAnimationFrame(anim);} else {layer.remove();}} anim();
        }
        window.addEventListener('scroll', ()=>{
            // 若烟花动画在运行，暂不触发彩带，避免叠加开销
            if(typeof fwState!=='undefined' && fwState.running) return;
            const st=scrollY; const dh=document.documentElement.scrollHeight-innerHeight; const pct= dh? (st/dh)*100:0;
            milestones.forEach(m=>{ if(pct>=m && !firedMilestones.has(m)){ firedMilestones.add(m); throwConfetti(m); }});
        });
})();
